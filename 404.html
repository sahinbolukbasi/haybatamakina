<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sayfa Bulunamadı | Haybata Makina</title>
    <!-- Anında Ana Sayfaya Yönlendirme (HTML Meta Refresh) -->
    <meta http-equiv="refresh" content="0; url=index.html">
    <link rel="canonical" href="https://www.haybatamakina.com/">
    <script>
        // Anında Ana Sayfaya Yönlendirme (JavaScript - replace ile geri butonu döngüsünü engeller)
        window.location.replace("index.html");
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-box {
            padding: 2rem;
            max-width: 480px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #2563eb;
            animation: spin 0.8s ease-in-out infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 1rem;
        }
        a {
            color: #38bdf8;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h1>Ana Sayfaya Yönlendiriliyorsunuz...</h1>
        <p>Aradığınız sayfa bulunamadı. Otomatik olarak ana sayfaya aktarılıyorsunuz.</p>
        <p><a href="index.html">Yönlendirme başlamazsa buraya tıklayın</a></p>
    </div>
</body>
</html>
