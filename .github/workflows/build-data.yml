name: Auto Build Data on CMS Update

on:
  push:
    paths:
      - 'data/products_catalog/**'
      - 'data/categories/**'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run build-data script
        run: node scripts/build-data.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products_merged.json data/products_index.json data/categories_merged.json data/categories_index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): rebuild merged product & category data [skip ci]" && git push)
