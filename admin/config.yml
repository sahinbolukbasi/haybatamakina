backend:
  name: github
  repo: sahinbolukbasi/haybatamakina
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  # =========================================================
  # 1. ÜRÜN KATEGORİLERİ & ALT BAŞLIKLAR
  # =========================================================
  - name: "categories"
    label: "Ürün Kategorileri & Alt Başlıklar"
    label_singular: "Kategori"
    folder: "data/categories"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Kategori Adı (Büyük Harfle)", name: "name", widget: "string", hint: "Örn: PASLANMAZ FİTTİNGS, PASLANMAZ MENHOL KAPAĞI vb." }
      - { label: "Link / Slug (Küçük Harfle)", name: "slug", widget: "string", hint: "Örn: paslanmaz-fittings" }
      - { label: "İkon (FontAwesome)", name: "icon", widget: "string", default: "fa-cubes", hint: "Örn: fa-wrench, fa-door-open, fa-cogs, fa-boxes-stacked" }
      - { label: "Sıralama No", name: "order", widget: "number", default: 1, value_type: "int" }
      - { label: "Kategori Açıklaması", name: "description", widget: "text", required: false }
      - label: "Alt Başlıklar (Bu Kategorinin Alt Grupları)"
        name: "subcategories"
        widget: "list"
        fields:
          - { label: "Alt Başlık Adı", name: "name", widget: "string", hint: "Örn: Kaynaklı Fittings, Dişli Fittings, Kelepçeler" }
          - { label: "Link / Slug", name: "slug", widget: "string", hint: "Örn: kaynakli-fittings" }
          - { label: "İkon (FontAwesome)", name: "icon", widget: "string", default: "fa-angle-right" }
          - { label: "Kısa Açıklama", name: "description", widget: "string", required: false }

  # =========================================================
  # 2. ÜRÜN KATALOĞU (YENİ ÜRÜN EKLE / DÜZENLE / FOTOĞRAF YÜKLE)
  # =========================================================
  - name: "catalog"
    label: "Ürün Kataloğu (Ürün Ekle & Düzenle)"
    label_singular: "Ürün"
    folder: "data/products_catalog"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Ürün Adı", name: "name", widget: "string" }
      - { label: "Anasayfada Göster (Öne Çıkar)", name: "showOnHome", widget: "boolean", default: false, hint: "İşaretlerseniz ürün ana sayfadaki vitrinde öne çıkarılır" }
      - label: "1. Kategori Başlığı (Ana Kategori)"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
        hint: "Ürünün ait olduğu ana kategoriyi seçin"

      - label: "2. Alt Başlık / Alt Kategori (Çoktan Seçmeli)"
        name: "subCategory"
        widget: "select"
        required: true
        hint: "Ürünün listeleneceği alt başlığı listeden seçin"
        options:
          - { label: "Kaynaklı Fittings Grubu [FİTTİNGS]", value: "Kaynaklı Fittings Grubu" }
          - { label: "Dişli Fittings Grubu [FİTTİNGS]", value: "Dişli Fittings Grubu" }
          - { label: "Kelepçe & Bağlantı Elemanları [FİTTİNGS]", value: "Kelepçe & Bağlantı Elemanları" }
          - { label: "Endüstriyel Flanşlar [FİTTİNGS]", value: "Endüstriyel Flanşlar" }
          - { label: "Paslanmaz Vana & Akış Ekipmanları [FİTTİNGS]", value: "Paslanmaz Vana & Akış Ekipmanları" }
          - { label: "Kazan & Tank Menhol Kapakları [MENHOL]", value: "Kazan & Tank Menhol Kapakları" }
          - { label: "Özel İmalat Proses Ekipmanları [ÖZEL İMALAT]", value: "Özel İmalat Proses Ekipmanları" }
          - { label: "Tank Havalandırma & CIP Yıkama Başlıkları [ÖZEL İMALAT]", value: "Tank Havalandırma & CIP Yıkama Başlıkları" }
          - { label: "Paslanmaz Bağlantı Elemanları & Civatalar [SARF MALZEME]", value: "Paslanmaz Bağlantı Elemanları & Civatalar" }
          - { label: "Kaynak & Yüzey İşlem Sarfları [SARF MALZEME]", value: "Kaynak & Yüzey İşlem Sarfları" }
          - { label: "Paslanmaz Çelik Hammaddeler [SARF MALZEME]", value: "Paslanmaz Çelik Hammaddeler" }
      - { label: "Ürün Fotoğrafı", name: "image", widget: "image" }
      - { label: "Ürün Açıklaması", name: "description", widget: "text" }
      - label: "Teknik Özellikler Tablosu"
        name: "specs"
        widget: "list"
        fields:
          - { label: "Özellik Adı (Örn: Çap, Basınç, Malzeme)", name: "key", widget: "string" }
          - { label: "Değer (Örn: DN50, 16 Bar, AISI 316L)", name: "value", widget: "string" }


  # =========================================================
  # 3. SİTE SAYFALARI & GENEL AYARLAR
  # =========================================================
  - name: "pages"
    label: "Site Sayfaları & İletişim / Sosyal Medya"
    delete: false
    editor:
      preview: false
    files:
      # A) İletişim & Sosyal Medya Ayarları
      - name: "contact_info"
        label: "İletişim & Sosyal Medya Hesapları"
        file: "data/contact.json"
        fields:
          - { label: "Firma Ünvanı", name: "companyName", widget: "string" }
          - { label: "Telefon Numarası", name: "phone", widget: "string" }
          - { label: "WhatsApp Numarası (Örn: 905521817077)", name: "whatsapp", widget: "string" }
          - { label: "Satış & Teklif E-Posta", name: "emailSales", widget: "string" }
          - { label: "Fabrika / Ofis Adresi", name: "address", widget: "text" }
          - { label: "Google Harita Yerleştirme (Embed) URL", name: "mapEmbed", widget: "string", required: false, hint: "Google Maps harita iframe src linki" }
          - { label: "Çalışma Saatleri", name: "hours", widget: "string" }
          - { label: "Instagram Linki", name: "instagram", widget: "string", required: false, hint: "https://www.instagram.com/hesabiniz" }
          - { label: "LinkedIn Linki", name: "linkedin", widget: "string", required: false, hint: "https://www.linkedin.com/company/hesabiniz" }
          - { label: "Facebook Linki", name: "facebook", widget: "string", required: false, hint: "https://www.facebook.com/hesabiniz" }
          - { label: "Twitter / X Linki", name: "twitter", widget: "string", required: false, hint: "https://twitter.com/hesabiniz" }
          - { label: "YouTube Linki", name: "youtube", widget: "string", required: false, hint: "https://www.youtube.com/@hesabiniz" }

      # B) Ana Sayfa Vitrin & Sloganlar
      - name: "home_page"
        label: "Ana Sayfa Vitrin & Sloganlar"
        file: "data/home.json"
        fields:
          - { label: "Ana Slogan / Başlık", name: "heroTitle", widget: "string" }
          - { label: "Alt Açıklama Metni", name: "heroSubtitle", widget: "text" }
          - { label: "Üst Rozet Metni", name: "heroBadge", widget: "string" }
          - { label: "Öne Çıkanlar Başlığı", name: "featuredProductsTitle", widget: "string" }
          - { label: "Öne Çıkanlar Alt Açıklama", name: "featuredProductsSubtitle", widget: "string" }

      # C) Hakkımızda & Kurumsal Metinler
      - name: "about_info"
        label: "Hakkımızda & Kurumsal Metinler"
        file: "data/about.json"
        fields:
          - { label: "Hakkımızda Giriş Metni", name: "intro", widget: "text" }
          - { label: "Misyon & Değerlerimiz", name: "values", widget: "text" }
          - { label: "Vizyon & Gelecek Hedefimiz", name: "goal", widget: "text" }

      # D) SEO & Arama Motoru Ayarları
      - name: "seo_info"
        label: "SEO & Google Arama Ayarları"
        file: "data/seo.json"
        fields:
          - { label: "Site Başlığı (Title)", name: "siteTitle", widget: "string" }
          - { label: "Google Açıklaması (Meta Description)", name: "defaultDescription", widget: "text" }
          - { label: "Anahtar Kelimeler (Virgülle ayırın)", name: "keywords", widget: "text" }
          - { label: "Google Analytics Ölçüm Kimliği (Örn: G-XXXXXXXXXX)", name: "googleAnalyticsId", widget: "string", required: false }
          - { label: "Google Search Console Doğrulama Kodu", name: "googleSiteVerification", widget: "string", required: false }
