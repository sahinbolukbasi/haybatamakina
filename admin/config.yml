backend:
  name: github
  repo: sahinbolukbasi/haybatamakina
  branch: main
  base_url: https://api.github.com

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  # 1. Genel Şirket, İletişim & Kurumsal Ayarlar (File-based Collection)
  - name: "settings"
    label: "Site & İletişim Ayarları"
    delete: false
    editor:
      preview: false
    files:
      - name: "contact_info"
        label: "İletişim & Firma Bilgileri"
        file: "data/contact.json"
        fields:
          - { label: "Firma Ünvanı", name: "companyName", widget: "string", default: "Haybata Makina San. ve Tic. Ltd. Şti." }
          - { label: "Telefon Numarası", name: "phone", widget: "string", default: "0212 671 25 77" }
          - { label: "Faks Numarası", name: "fax", widget: "string", default: "0212 671 25 78" }
          - { label: "WhatsApp Numarası (Örn: 902126712577)", name: "whatsapp", widget: "string", default: "902126712577" }
          - { label: "Satış & Teklif E-Posta", name: "emailSales", widget: "string", default: "satis@haybatamakina.com" }
          - { label: "Genel Bilgi E-Posta", name: "emailInfo", widget: "string", default: "bilgi@haybatamakina.com" }
          - { label: "Fabrika / Ofis Adresi", name: "address", widget: "text", default: "İkitelli Organize Sanayi Bölgesi, Bağcılar Güngören Sanayi Bölgesi Blok:11 No:19, Başakşehir / İSTANBUL" }
          - { label: "Çalışma Saatleri", name: "hours", widget: "string", default: "Hafta içi: 08:00 - 18:00 | Cumartesi: 09:00 - 14:00" }

      - name: "about_info"
        label: "Hakkımızda & Kurumsal Metinler"
        file: "data/about.json"
        fields:
          - { label: "Giriş / Özet Metni", name: "intro", widget: "text" }
          - { label: "Misyon & Değerlerimiz", name: "values", widget: "text" }
          - { label: "Vizyon & Hedefimiz", name: "goal", widget: "text" }

      - name: "references_info"
        label: "Sanayi Referansları"
        file: "data/references.json"
        fields:
          - label: "Referans Listesi"
            name: "items"
            widget: "list"
            fields:
              - { label: "Firma / Kurum Adı", name: "name", widget: "string" }
              - { label: "Sektör", name: "sector", widget: "string" }
              - { label: "Yapılan İş / Ekipman", name: "desc", widget: "string" }

  # 2. Projeler & Sanayi Kazanları (Folder-based Collection)
  - name: "projects"
    label: "Projeler & Kazan İmalatları"
    folder: "data/projects"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Proje / Kazan Başlığı", name: "title", widget: "string" }
      - { label: "Kategori", name: "category", widget: "select", options: [
          { label: "Buhar Kazanı", value: "buhar-kazani" },
          { label: "Kızgın Yağ Kazanı", value: "kizgin-yag" },
          { label: "Sıcak Su Kazanı", value: "sicak-su" },
          { label: "Proses Tankı & Reaktör", value: "proses-tanki" },
          { label: "Tesis Montaj & Borulama", value: "tesis-montaj" }
        ]}
      - { label: "Kategori Etiketi", name: "categoryLabel", widget: "string", default: "Buhar Kazanı İmalatı" }
      - { label: "Müşteri / Tesis Adı", name: "client", widget: "string" }
      - { label: "Şehir / Konum", name: "location", widget: "string" }
      - { label: "Tamamlanma Yılı", name: "year", widget: "string", default: "2024" }
      - { label: "Kazan / Proje Görseli", name: "image", widget: "image" }
      - { label: "Kısa Özet Açıklama", name: "summary", widget: "text" }
      - { label: "Öne Çıkan Özellikler", name: "highlights", widget: "list", field: { label: "Özellik Maddesi", name: "item", widget: "string" } }
