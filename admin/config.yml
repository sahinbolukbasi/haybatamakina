backend:
  name: github
  repo: sahinbolukbasi/haybatamakina
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  # =========================================================
  # 1. TÜM SİTE AYARLARI, METİNLER VE KURUMSAL BİLGİLER
  # =========================================================
  - name: "pages"
    label: "Site Sayfaları & Genel Ayarlar"
    delete: false
    editor:
      preview: false
    files:
      # A) Ana Sayfa Vitrin & İstatistikler
      - name: "home_page"
        label: "Ana Sayfa Vitrin & Sloganlar"
        file: "data/home.json"
        fields:
          - { label: "Ana Slogan / Başlık", name: "heroTitle", widget: "string" }
          - { label: "Alt Açıklama Metni", name: "heroSubtitle", widget: "text" }
          - { label: "Üst Rozet Metni", name: "heroBadge", widget: "string" }
          - { label: "Öne Çıkanlar Başlığı", name: "featuredProductsTitle", widget: "string" }
          - { label: "Öne Çıkanlar Alt Açıklama", name: "featuredProductsSubtitle", widget: "string" }
          - label: "Ana Sayfa İstatistik Sayaçları"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Sayı / Değer (Örn: 30+, %99)", name: "number", widget: "string" }
              - { label: "Etiket (Örn: Yıllık Tecrübe)", name: "label", widget: "string" }
              - { label: "Kısa Alt Not", name: "desc", widget: "string" }

      # B) Şirket İletişim & Sosyal Medya
      - name: "contact_info"
        label: "İletişim & Şirket Bilgileri"
        file: "data/contact.json"
        fields:
          - { label: "Firma Ünvanı", name: "companyName", widget: "string" }
          - { label: "Telefon Numarası", name: "phone", widget: "string" }
          - { label: "Faks Numarası", name: "fax", widget: "string" }
          - { label: "WhatsApp Numarası (Örn: 902126712577)", name: "whatsapp", widget: "string" }
          - { label: "Satış & Teklif E-Posta", name: "emailSales", widget: "string" }
          - { label: "Genel Bilgi E-Posta", name: "emailInfo", widget: "string" }
          - { label: "Fabrika / Ofis Adresi", name: "address", widget: "text" }
          - { label: "Çalışma Saatleri", name: "hours", widget: "string" }

      # C) Hakkımızda & Kurumsal Metinler
      - name: "about_info"
        label: "Hakkımızda & Kurumsal Metinler"
        file: "data/about.json"
        fields:
          - { label: "Hakkımızda Giriş Metni", name: "intro", widget: "text" }
          - { label: "Misyon & Değerlerimiz", name: "values", widget: "text" }
          - { label: "Vizyon & Gelecek Hedefimiz", name: "goal", widget: "text" }

      # D) Sanayi Referansları
      - name: "references_info"
        label: "Sanayi Referansları"
        file: "data/references.json"
        fields:
          - label: "Referans Listesi"
            name: "items"
            widget: "list"
            fields:
              - { label: "Firma / Kurum Adı", name: "name", widget: "string" }
              - { label: "Sektör", name: "sector", widget: "string" }
              - { label: "Yapılan İş / Ekipman", name: "desc", widget: "string" }

      # E) SEO & Arama Motoru Ayarları
      - name: "seo_info"
        label: "SEO & Google Arama Ayarları"
        file: "data/seo.json"
        fields:
          - { label: "Site Başlığı (Title)", name: "siteTitle", widget: "string" }
          - { label: "Google Açıklaması (Meta Description)", name: "defaultDescription", widget: "text" }
          - { label: "Anahtar Kelimeler (Virgülle ayırın)", name: "keywords", widget: "text" }

  # =========================================================
  # 2. PROJELER & REFERANS KAZAN İMALATLARI
  # =========================================================
  - name: "projects"
    label: "Projeler & Kazan İmalatları"
    folder: "data/projects"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Proje / Kazan Başlığı", name: "title", widget: "string" }
      - { label: "Kategori", name: "category", widget: "select", options: [
          { label: "Buhar Kazanı", value: "buhar-kazani" },
          { label: "Kızgın Yağ Kazanı", value: "kizgin-yag" },
          { label: "Sıcak Su Kazanı", value: "sicak-su" },
          { label: "Proses Tankı & Reaktör", value: "proses-tanki" },
          { label: "Tesis Montaj & Borulama", value: "tesis-montaj" }
        ]}
      - { label: "Kategori Etiketi", name: "categoryLabel", widget: "string", default: "Buhar Kazanı İmalatı" }
      - { label: "Müşteri / Tesis Adı", name: "client", widget: "string" }
      - { label: "Şehir / Konum", name: "location", widget: "string" }
      - { label: "Tamamlanma Yılı", name: "year", widget: "string", default: "2024" }
      - { label: "Kazan / Proje Görseli", name: "image", widget: "image" }
      - { label: "Kısa Özet Açıklama", name: "summary", widget: "text" }
      - { label: "Öne Çıkan Özellikler", name: "highlights", widget: "list", field: { label: "Özellik Maddesi", name: "item", widget: "string" } }
